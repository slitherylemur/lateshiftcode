# LateShift Cloud runtime socket root.
# Installed to /etc/tmpfiles.d/lsc.conf.
#
# MUST be root-owned. t3ws@.service creates /run/lsc/<workspace> via
# RuntimeDirectory=lsc/<workspace>; if /run/lsc did not already exist, systemd
# would create it owned by the FIRST workspace account to start. That account
# could then create or replace /run/lsc/<other-workspace>/http.sock and
# impersonate another workspace to the gateway. Pre-creating it root:root 0755
# makes that impossible.
#
# 0755 (not 0750): Caddy must traverse it, and the per-workspace subdirectories
# are themselves 0750 <workspace>:caddy, so traversal of the parent leaks
# nothing beyond the list of workspace names.
d /run/lsc 0755 root root -
